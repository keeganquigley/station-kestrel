name: Browser tests

on:
  pull_request:
    branches: [main]

# a newer push to the same pull request makes the older run pointless
concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: Walkthrough and seethrough
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the build
        run: |
          npm run preview > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat preview.log
          exit 1
      - run: npm run walkthrough -- tests/shots
      - run: npm run seethrough
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: walkthrough-screenshots
          path: tests/shots
          if-no-files-found: ignore
