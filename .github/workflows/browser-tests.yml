name: Browser tests

on:
  pull_request:
    branches: [main]

# a newer push to the same pull request makes the older run pointless
concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    # the walkthrough's three chapters and seethrough do not depend on each other, so they run side by side
    # and the wait is the longest of the four; a failure in one chapter does not hide the others
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Walkthrough, chapter one
            run: KESTREL_CHAPTER=1 npm run walkthrough -- tests/shots
            shots: walkthrough-screenshots-chapter-one
          - name: Walkthrough, chapter two
            run: KESTREL_CHAPTER=2 npm run walkthrough -- tests/shots
            shots: walkthrough-screenshots-chapter-two
          - name: Walkthrough, chapter three
            run: KESTREL_CHAPTER=3 npm run walkthrough -- tests/shots
            shots: walkthrough-screenshots-chapter-three
          - name: Seethrough
            run: npm run seethrough
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # the build with the test hook in it; the published game is built without
      - run: npm run build:test
      - name: Serve the build
        run: |
          npm run preview > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat preview.log
          exit 1
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
      # only the walkthrough takes screenshots, and each of its jobs uploads under a name of its own
      - if: failure() && matrix.shots
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.shots }}
          path: tests/shots
          if-no-files-found: ignore
