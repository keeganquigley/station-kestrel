name: Browser tests

on:
  pull_request:
    branches: [main]

# a newer push to the same pull request makes the older run pointless
concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    # the two tests do not depend on each other, so they run side by side and the wait is the longer one
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Walkthrough
            run: npm run walkthrough -- tests/shots
          - name: Seethrough
            run: npm run seethrough
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # the build with the test hook in it; the published game is built without
      - run: npm run build:test
      - name: Serve the build
        run: |
          npm run preview > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat preview.log
          exit 1
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: walkthrough-screenshots
          path: tests/shots
          if-no-files-found: ignore
