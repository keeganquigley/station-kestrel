name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also from the Actions tab, by hand

permissions:
  contents: read
  pages: write
  id-token: write

# never two deployments at once; let one in progress finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: ./.github/actions/build-game
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
